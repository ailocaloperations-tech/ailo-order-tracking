name: checks

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php:
    name: PHP lint + WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer, cs2pr
      - name: Lint every PHP file
        run: find ailo-order-tracking -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install WPCS
        run: |
          # Composer 2.2+ refuses to run a plugin that has not been allowed, and
          # --no-interaction answers "no". Without this the sniffs install but
          # never register, and phpcs then cannot find the WordPress standard.
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require wp-coding-standards/wpcs:"^3" --no-interaction
          # Not $HOME/.composer: Composer 2 keeps its home at $HOME/.config/composer
          # on Linux. Ask it rather than guessing.
          echo "$(composer config --global home)/vendor/bin" >> $GITHUB_PATH
      - name: phpcs
        # No --standard: that would override phpcs.xml, which is where the
        # WooCommerce capabilities and the plugin's own sanitiser are declared.
        run: phpcs

  js:
    name: Block build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: ailo-order-tracking
        run: npm install
      - working-directory: ailo-order-tracking
        run: npm run lint:js
      - working-directory: ailo-order-tracking
        run: npm run build

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: ailo-order-tracking
        run: npm install && npm run build
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./ailo-order-tracking
