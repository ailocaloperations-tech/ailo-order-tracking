name: release

# The published zip MUST contain build/, because build output is not in version
# control — a plugin installed from a source clone has no block. This builds it.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an existing release to attach the zip to. Leave empty to only build it.'
        required: false
        default: ''

jobs:
  zip:
    runs-on: ubuntu-latest
    # Attaching the zip updates the release. The default token is read-only,
    # which is why v1.1.0 got no zip ("Resource not accessible by integration").
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: ailo-order-tracking
        run: npm ci || npm install
      - working-directory: ailo-order-tracking
        run: npm run build
      - name: Fail if the block did not build
        run: test -f ailo-order-tracking/build/block.json
      - name: Package
        run: |
          mkdir -p dist
          # src/ and package.json STAY in the zip. Guideline 4 requires that the
          # distributed plugin either contains human-readable source or links to
          # where it lives; shipping only the minified build with no source is a
          # rejection reason, and the few extra kilobytes are not worth arguing
          # about with a reviewer.
          zip -r dist/ailo-order-tracking.zip ailo-order-tracking \
            -x 'ailo-order-tracking/node_modules/*' \
               'ailo-order-tracking/tests/*' \
               'ailo-order-tracking/phpunit.xml.dist' \
               'ailo-order-tracking/package-lock.json'
      - uses: actions/upload-artifact@v4
        with:
          name: ailo-order-tracking
          path: dist/ailo-order-tracking.zip
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/ailo-order-tracking.zip
